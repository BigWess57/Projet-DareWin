services:
    graph-node:
        image: graphprotocol/graph-node
        ports:
            - "8000:8000" # GraphQL
            - "8001:8001"
            - "8020:8020" # Graph Node HTTP API
            - "8030:8030"
            - "8040:8040"
        depends_on:
            - ipfs
            - postgres
        environment:
            postgres_host: postgres
            postgres_user: graph-node
            postgres_pass: let-me-in
            postgres_db: graph-node
            ipfs: "ipfs:5001"
            # We map whatever name is in the .env to the host URL
            ethereum: "${GRAPH_NETWORK_NAME}:http://host.docker.internal:8545"
            RUST_LOG: info
            # Stop fetching receipts in parallel (Batches are safer for local nodes)
            GRAPH_ETHEREUM_FETCH_TXN_RECEIPTS_IN_BATCHES: "true"
            # Hints where to start (CHANGE DEPENDING ON IF WE ARE FORKING OR NOT)
            GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER: "${GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER}"
            # Limit concurrent requests (Default is 1000! We set to 100)
            GRAPH_ETHEREUM_BLOCK_INGESTOR_MAX_CONCURRENT_JSON_RPC_CALLS_FOR_TXN_RECEIPTS: 100

    ipfs:
        image: ipfs/kubo:latest
        ports:
            - "5001:5001"
        volumes:
            - ./data/ipfs:/data/ipfs
        environment:
            GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: 1
    postgres:
        image: postgres:15
        ports:
            - "5432:5432"
        command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
        environment:
            POSTGRES_USER: graph-node
            POSTGRES_PASSWORD: let-me-in
            POSTGRES_DB: graph-node
            POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
